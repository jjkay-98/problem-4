services:
  - type: web
    name: shaas-banking-demo
    runtime: python
    plan: free
    buildCommand: echo "No external packages required"
    startCommand: python backend/server.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: SHAAS_HOST
        value: 0.0.0.0
